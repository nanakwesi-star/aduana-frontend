const API_BASE = "https://aduana-results-api.onrender.com";

const STATUS_META = {
  draft: { label: "Draft", color: "bg-stone-200 text-stone-700" },
  submitted: { label: "Awaiting Admin Review", color: "bg-amber-100 text-amber-800" },
  admin_returned: { label: "Returned to Teacher", color: "bg-rose-100 text-rose-800" },
  admin_approved: { label: "Awaiting Headmaster", color: "bg-violet-100 text-violet-800" },
  hm_returned: { label: "Returned to Administrator", color: "bg-rose-100 text-rose-800" },
  published: { label: "Published", color: "bg-emerald-100 text-emerald-800" },
  correction_pending_admin: { label: "Correction — Awaiting Admin", color: "bg-amber-100 text-amber-800" },
  correction_pending_hm: { label: "Correction — Awaiting Headmaster", color: "bg-violet-100 text-violet-800" },
  locked: { label: "Permanently Locked", color: "bg-stone-800 text-stone-100" },
};

function decodeToken(token) {
  try {
    const payload = token.split(".")[1];
    const norm = payload.replace(/-/g, "+").replace(/_/g, "/");
    const padded = norm + "===".slice((norm.length + 3) % 4);
    return JSON.parse(atob(padded));
  } catch { return null; }
}

function fmt(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleString(undefined, { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function getOrdinalSuffix(n) {
  if (!n || isNaN(n)) return "—";
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

async function api(path, token, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
  return data;
}

function Badge({ status }) {
  const meta = STATUS_META[status] || { label: status, color: "bg-stone-200 text-stone-700" };
  return <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${meta.color}`}>{meta.label}</span>;
}

function PtaStatusBadge({ status }) {

function Btn({ children, onClick, kind = "secondary", disabled }) {
  const styles = {
    primary: "bg-gold text-violet-950 font-semibold hover:bg-gold-light",
    success: "bg-emerald-700 text-white hover:bg-emerald-800",
    danger: "bg-rose-700 text-white hover:bg-rose-800",
    secondary: "bg-stone-200 text-stone-800 hover:bg-stone-300",
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed ${styles[kind]}`}>
      {children}
    </button>
  );
}

function ChangePasswordModal({ token, onClose, showToastFn }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);

  async function submit() {
    if (newPassword.length < 8) return setError("New password must be at least 8 characters.");
    if (newPassword !== confirmPassword) return setError("New passwords do not match.");
    setSaving(true); setError(null);
    try {
      await api("/api/auth/change-password", token, { method: "POST", body: JSON.stringify({ currentPassword, newPassword }) });
      showToastFn("Password changed.", "success");
      onClose();
    } catch (e) { setError(e.message); }
    setSaving(false);
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-5">
        <div className="font-medium mb-3">Change Password</div>
        <input type="password" placeholder="Current password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        <input type="password" placeholder="New password (min 8 chars)" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        <input type="password" placeholder="Confirm new password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        {error && <div className="text-rose-700 text-xs mb-2">{error}</div>}
        <div className="flex justify-end gap-2 mt-2">
          <Btn onClick={onClose}>Cancel</Btn>
          <Btn kind="primary" onClick={submit} disabled={saving}>{saving ? "Saving…" : "Save"}</Btn>
        </div>
      </div>
    </div>
  );
}

function ParentDashboard({ user, token, onSignOut }) {
  const [children, setChildren] = useState([]);
  const [selectedChild, setSelectedChild] = useState(null);
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showChangePw, setShowChangePw] = useState(false);
  const [toast, setToast] = useState(null);
  function showToast(msg, kind = "info") { setToast({ msg, kind }); setTimeout(() => setToast(null), 3000); }

  useEffect(() => {
    api("/api/parent/children", token).then((rows) => {
      setChildren(rows);
      if (rows.length === 1) setSelectedChild(rows[0].id);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [token]);

  useEffect(() => {
    if (!selectedChild) { setResults(null); return; }
    api(`/api/parent/children/${selectedChild}/results`, token).then(setResults).catch(() => setResults([]));
  }, [selectedChild, token]);

  const child = children.find((c) => c.id === selectedChild);

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <div className="bg-violet-950 text-violet-50 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xl">🏅</span>
          <div><div className="font-serif text-lg leading-tight">Aduana Model JHS</div>
          <div className="text-[11px] text-violet-300 -mt-0.5">Parent Portal</div></div>
        </div>
        <div className="flex items-center gap-3 text-sm">
          <span className="text-violet-200">{user.name} · Parent</span>
          <button onClick={() => setShowChangePw(true)} className="text-violet-300 hover:text-white">Change password</button>
          <button onClick={onSignOut} className="text-violet-300 hover:text-white">Sign out</button>
        </div>
      </div>
      {showChangePw && <ChangePasswordModal token={token} onClose={() => setShowChangePw(false)} showToastFn={showToast} />}
      {toast && <div className={`fixed bottom-4 right-4 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white z-50 ${toast.kind === "error" ? "bg-rose-700" : toast.kind === "success" ? "bg-emerald-700" : "bg-stone-800"}`}>{toast.msg}</div>}

      <div className="max-w-3xl mx-auto p-4 md:p-6">
        {loading ? (
          <div className="text-stone-400 text-sm">Loading…</div>
        ) : children.length === 0 ? (
          <div className="bg-white border border-stone-200 rounded-xl p-6 text-sm text-stone-500">
            No children are linked to your account yet. Contact the school office to have them linked.
          </div>
        ) : (
          <>
            <h1 className="font-serif text-2xl mb-3">My Children</h1>
            <div className="flex flex-wrap gap-2 mb-5">
              {children.map((c) => (
                <button key={c.id} onClick={() => setSelectedChild(c.id)}
                  className={`px-3 py-2 rounded-lg border text-sm ${selectedChild === c.id ? "bg-violet-800 text-white border-violet-800" : "bg-white border-stone-200 hover:border-violet-300"}`}>
                  {c.full_name} <span className="opacity-70">· {c.class}</span>
                </button>
              ))}
            </div>

            {child && (
              <div>
                <div className="bg-white border border-stone-200 rounded-xl p-4 mb-3">
                  <div className="font-medium">{child.full_name}</div>
                  <div className="text-sm text-stone-500">{child.class} · Admission No. {child.admission_no}</div>
                </div>
                <h2 className="font-serif text-lg mb-2">Published Results</h2>
                {results === null ? (
                  <div className="text-sm text-stone-400">Loading…</div>
                ) : results.length === 0 ? (
                  <div className="bg-white border border-stone-200 rounded-xl p-4 text-sm text-stone-500">No published results yet.</div>
                ) : (
                  <div className="space-y-2">
                    {results.map((r, i) => (
                      <div key={i} className="bg-white border border-stone-200 rounded-xl p-4 flex items-center justify-between">
                        <div>
                          <div className="font-medium">{r.subject}</div>
                          <div className="text-xs text-stone-500">{r.term} {r.academic_year} · Published {fmt(r.published_at)}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xl font-serif">{r.score}</div>
                          {r.grade && <div className="text-xs text-stone-500">Grade {r.grade}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

        <div className="grid grid-cols-2 gap-3 mb-6">

            <div className="text-2xl font-serif">{results ? results.length : "—"}</div>
            <div className="text-xs text-stone-500">Published Results</div>
          </div>
          <div className="bg-white border border-stone-200 rounded-xl p-4 text-center">
            <div className="text-2xl font-serif">{average ?? "—"}</div>
            <div className="text-xs text-stone-500">Average Score</div>
          </div>
        </div>

        <h2 className="font-serif text-lg mb-2">My Results</h2>
        {results === null ? (
          <div className="text-sm text-stone-400">Loading…</div>
        ) : results.length === 0 ? (
          <div className="bg-white border border-stone-200 rounded-xl p-4 text-sm text-stone-500">No published results yet.</div>
        ) : (
          <div className="space-y-2">
            {results.map((r, i) => (
              <div key={i} className="bg-white border border-stone-200 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="font-medium">{r.subject}</div>
                  <div className="text-xs text-stone-500">{r.term} {r.academic_year} · Published {fmt(r.published_at)}</div>
                </div>
                <div className="text-right">
                  <div className="text-xl font-serif">{r.score}</div>
                  {r.grade && <div className="text-xs text-stone-500">Grade {r.grade}</div>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

  function downloadCsvTemplate(filename, headers, exampleRow) {
    const csv = [headers.join(","), exampleRow.join(",")].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // New assessment model: Class Work = Individual Test + Group Work +
  // Class Test + Project (each 0-15, raw total out of 60) scaled to 50.
  // Exam is entered raw out of 100 and scaled to 50. Total is out of 100.
  // Kept in sync with the same rounding the backend applies.
  function computeScaledMarks(m) {
    const it = Number(m.individual_test || 0);
    const gw = Number(m.group_work || 0);
    const ct = Number(m.class_test || 0);
    const pr = Number(m.project || 0);
    const er = Number(m.exam_raw || 0);
    const classworkRaw = it + gw + ct + pr;
    const classScore = Math.round((classworkRaw * 50 / 60) * 100) / 100;
    const examScore = Math.round((er * 50 / 100) * 100) / 100;
    const total = Math.round((classScore + examScore) * 100) / 100;
    return { classworkRaw, classScore, examScore, total };
  }

  function startMarksEdit() {
    const existing = new Map(exam.marks.map((m) => [m.student_id, m]));

        group_work: record?.group_work ?? "",
        class_test: record?.class_test ?? "",

      };
    }));

  function handleScoreChange(index, field, value) {
    if (!marksEdit) return;
    const updated = [...marksEdit];
    updated[index] = { ...updated[index], [field]: value };
    setMarksEdit(updated);
  }

  async function saveMarks() {
    // Individual Test, Group Work, Class Test, Project: 0-15 each. Exam: 0-100.
    const invalid = marksEdit.some((m) => {
      const componentFields = ["individual_test", "group_work", "class_test", "project"];
      for (const f of componentFields) {
        const v = Number(m[f]);
        if (m[f] !== "" && (v < 0 || v > 15)) return true;
      }
      const er = Number(m.exam_raw);
      if (m.exam_raw !== "" && (er < 0 || er > 100)) return true;
      return false;
    });
    if (invalid) {
      showToast("Individual Test, Group Work, Class Test, and Project must each be between 0 and 15. Exam must be between 0 and 100.", "error");
      return;
    }

    const marks = marksEdit
      .filter((m) => ["individual_test", "group_work", "class_test", "project", "exam_raw"].some((f) => m[f] !== ""))
      .map((m) => {
        const individualTest = Number(m.individual_test || 0);
        const groupWork = Number(m.group_work || 0);
        const classTest = Number(m.class_test || 0);
        const project = Number(m.project || 0);
        const examRaw = Number(m.exam_raw || 0);
        const { classScore, examScore, total } = computeScaledMarks(m);
        return {
          student_id: m.student_id,
          individual_test: individualTest,
          group_work: groupWork,
          class_test: classTest,
          project: project,
          exam_raw: examRaw,
          class_score: classScore,
          exam_score: examScore,
          score: total,
          total: total,
          total_score: total
        };
      });

    if (correctionMode) {
      setModal("file_correction");
      return;
    }

    try {
      await api(`/api/exams/${exam.id}/marks`, token, {
        method: "PUT",
        body: JSON.stringify({ marks })
      });
      showToast("Marks saved successfully.", "success");
      await loadExamDetail(exam.id);
    } catch (e) {
      showToast(e.message, "error");
    }
  }

  const [uploadResult, setUploadResult] = useState(null);
  const [uploading, setUploading] = useState(false);

  async function uploadStudentsFile(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;
    setUploading(true); setUploadResult(null);
    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("class", exam.class);
      const res = await fetch(`${API_BASE}/api/students/bulk-upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Upload failed.");
      setUploadResult(json);
      showToast(`${json.added.length} student(s) submitted — pending Headmaster approval.`, "success");
    } catch (e) { showToast(e.message, "error"); }
    setUploading(false);
    fileInput.value = "";
  }

  const [marksUploadResult, setMarksUploadResult] = useState(null);
  const [marksUploading, setMarksUploading] = useState(false);

  async function uploadMarksFile(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;
    setMarksUploading(true); setMarksUploadResult(null);
    try {
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch(`${API_BASE}/api/exams/${exam.id}/marks/bulk-upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Upload failed.");
      setMarksUploadResult(json);
      showToast(`${json.updated.length} mark(s) updated.`, "success");
      await loadExamDetail(exam.id);
    } catch (e) { showToast(e.message, "error"); }
    setMarksUploading(false);
    fileInput.value = "";
  }

  async function act(path, method = "POST", body) {
    try {
      await api(`/api/exams/${exam.id}${path}`, token, { method, body: body ? JSON.stringify(body) : undefined });
      showToast("Done.", "success");
      await Promise.all([loadExamDetail(exam.id), loadExams()]);
    } catch (e) { showToast(e.message, "error"); }
  }

  function openReasonModal(type) { setReason(""); setModal(type); }
  async function confirmModal() {
    if (!reason.trim()) return showToast("A reason is required.", "error");
    if (modal === "admin_return") await act("/admin-return", "POST", { reason });
    if (modal === "hm_return") await act("/hm-return", "POST", { reason });
    if (modal === "reject_correction") await decideCorrection(false, reason);
    if (modal === "emergency_unlock") {
      try {
        await api(`/api/super-admin/exams/${exam.id}/emergency-unlock`, token, { method: "POST", body: JSON.stringify({ reason }) });
        showToast("Exam unlocked.", "success");
        await Promise.all([loadExamDetail(exam.id), loadExams()]);
      } catch (e) { showToast(e.message, "error"); }
    }
    if (modal === "file_correction") {
      const marks = marksEdit
        .filter((m) => ["individual_test", "group_work", "class_test", "project", "exam_raw"].some((f) => m[f] !== ""))
        .map((m) => {
          const individualTest = Number(m.individual_test || 0);
          const groupWork = Number(m.group_work || 0);
          const classTest = Number(m.class_test || 0);
          const project = Number(m.project || 0);
          const examRaw = Number(m.exam_raw || 0);
          const { classScore, examScore, total } = computeScaledMarks(m);
          return {
            student_id: m.student_id,
            individual_test: individualTest,
            group_work: groupWork,
            class_test: classTest,
            project: project,
            exam_raw: examRaw,
            class_score: classScore,
            exam_score: examScore,
            score: total,
            total: total,
            total_score: total
          };
        });
      try {
        await api(`/api/exams/${exam.id}/correction-request`, token, {
          method: "POST",
          body: JSON.stringify({ marks, reason })
        });
        showToast("Correction request submitted for review.", "success");
        setCorrectionMode(false);
        setMarksEdit(null);
        await loadExamDetail(exam.id);
      } catch (e) {
        showToast(e.message, "error");
      }
    }
    setModal(null);
    setReason("");
  }

                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "160px" }}>Student Name</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "110px" }}>Admission No.</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "90px" }}>Ind. Test (15)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "90px" }}>Group Work (15)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "90px" }}>Class Test (15)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "90px" }}>Project (15)</th>
                            </tr>
                          ) : (
                            <tr className="border-b border-stone-200 text-xs font-semibold uppercase tracking-wider text-stone-500 bg-stone-50">
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "180px" }}>Student Name</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "130px" }}>Admission No.</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "120px" }}>Class Work (50)</th>
                            </tr>
                          )}
                        </thead>
                        <tbody className="divide-y divide-stone-100 text-sm">
                          {marksEdit ? (
                            marksEdit.map((m, idx) => (
                              <tr key={m.student_id} className="hover:bg-stone-50/50">
                                <td className="py-3 px-4 font-medium" style={{ minWidth: "160px" }}>{m.name || "—"}</td>
                                <td className="py-3 px-4 text-stone-500 text-xs" style={{ minWidth: "110px" }}>{students.find(s => s.id === m.student_id)?.admission_no || "—"}</td>
                                <td className="py-3 px-4">
                                  <input type="number" min="0" max="15" value={m.individual_test} onChange={(ev) => handleScoreChange(idx, "individual_test", ev.target.value)} className="w-16 border border-stone-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:border-gold" />
                                </td>
                                <td className="py-3 px-4">
                                  <input type="number" min="0" max="15" value={m.group_work} onChange={(ev) => handleScoreChange(idx, "group_work", ev.target.value)} className="w-16 border border-stone-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:border-gold" />
                                </td>
                                <td className="py-3 px-4">
                                  <input type="number" min="0" max="15" value={m.class_test} onChange={(ev) => handleScoreChange(idx, "class_test", ev.target.value)} className="w-16 border border-stone-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:border-gold" />
                                </td>
                                <td className="py-3 px-4">
                                  <input type="number" min="0" max="15" value={m.project} onChange={(ev) => handleScoreChange(idx, "project", ev.target.value)} className="w-16 border border-stone-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:border-gold" />
                                </td>
                              </tr>
                            ))
                          ) : exam.marks && exam.marks.length > 0 ? (
                            exam.marks.map((m, idx) => (
                              <tr key={idx} className="hover:bg-stone-50/50">
                                <td className="py-3 px-4 font-medium" style={{ minWidth: "180px" }}>{m.student_name || "—"}</td>
                                <td className="py-3 px-4 text-stone-500 text-xs" style={{ minWidth: "130px" }}>{m.admission_no || "—"}</td>
                                <td className="py-3 px-4">{m.class_score ?? "—"}</td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="3" className="py-8 text-center text-stone-400">No marks entered yet. Click "Edit Marks" to begin.</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Tab Content: Examination */}
                {tab === "examination" && (
                  <div className="p-5 space-y-4">
                    <h3 className="font-serif text-lg mb-1">Examination</h3>
                    <p className="text-xs text-stone-500 mb-2">Exam score (out of 100), scaled to 50. Grade and Position are assigned once the exam sheet is published.</p>
                    {pendingCorrection && (
                      <div className="bg-amber-50 border border-amber-200 text-amber-900 p-4 rounded-xl text-sm">
                        <span className="font-semibold">Pending Correction Request:</span> {pendingCorrection.reason}
                      </div>
                    )}
                    <div className="text-[11px] text-stone-400 px-1 sm:hidden">⇠ Swipe to see all columns ⇢</div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse" style={{ minWidth: marksEdit ? "560px" : "620px" }}>
                        <thead>
                          {marksEdit ? (
                            <tr className="border-b border-stone-200 text-xs font-semibold uppercase tracking-wider text-stone-500 bg-stone-50">
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "160px" }}>Student Name</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "110px" }}>Admission No.</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "90px" }}>Exam (100)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "100px" }}>Total (100)</th>
                            </tr>
                          ) : (
                            <tr className="border-b border-stone-200 text-xs font-semibold uppercase tracking-wider text-stone-500 bg-stone-50">
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "180px" }}>Student Name</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "130px" }}>Admission No.</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "120px" }}>Exam Score (50)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "120px" }}>Total Score (100)</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "80px" }}>Grade</th>
                              <th className="py-3 px-4 whitespace-nowrap" style={{ minWidth: "70px" }}>Pos.</th>
                            </tr>
                          )}
                        </thead>
                        <tbody className="divide-y divide-stone-100 text-sm">
                          {marksEdit ? (
                            marksEdit.map((m, idx) => {
                              const { total } = computeScaledMarks(m);
                              const hasAnyInput = ["individual_test", "group_work", "class_test", "project", "exam_raw"].some((f) => m[f] !== "");
                              return (
                                <tr key={m.student_id} className="hover:bg-stone-50/50">
                                  <td className="py-3 px-4 font-medium" style={{ minWidth: "160px" }}>{m.name || "—"}</td>
                                  <td className="py-3 px-4 text-stone-500 text-xs" style={{ minWidth: "110px" }}>{students.find(s => s.id === m.student_id)?.admission_no || "—"}</td>
                                  <td className="py-3 px-4">
                                    <input type="number" min="0" max="100" value={m.exam_raw} onChange={(ev) => handleScoreChange(idx, "exam_raw", ev.target.value)} className="w-20 border border-stone-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:border-gold" />
                                  </td>
                                  <td className="py-3 px-4 font-serif font-semibold">{hasAnyInput ? total : "—"}</td>
                                </tr>
                              );
                            })
                          ) : exam.marks && exam.marks.length > 0 ? (
                            exam.marks.map((m, idx) => (
                              <tr key={idx} className="hover:bg-stone-50/50">
                                <td className="py-3 px-4 font-medium" style={{ minWidth: "180px" }}>{m.student_name || "—"}</td>
                                <td className="py-3 px-4 text-stone-500 text-xs" style={{ minWidth: "130px" }}>{m.admission_no || "—"}</td>
                                <td className="py-3 px-4">{m.exam_score ?? "—"}</td>
                                <td className="py-3 px-4 font-serif font-semibold">{m.score}</td>
                                <td className="py-3 px-4 font-semibold text-violet-900">{m.grade ?? "—"}</td>
                                <td className="py-3 px-4">{getOrdinalSuffix(m.position)}</td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="6" className="py-8 text-center text-stone-400">No marks entered yet. Click "Edit Marks" to begin.</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                      {marksEdit && (
                        <p className="text-xs text-stone-500 mt-2 px-1">Total combines Classwork (scaled to 50) and Exam (scaled to 50), out of 100.</p>
                      )}
                    </div>
                  </div>
                )}

                {/* Tab Content: Audit Trail */}
                {tab === "audit" && (
                  <div className="p-5 space-y-3">
                    <h3 className="font-serif text-lg mb-2">Audit Log</h3>
                    {auditLog.length === 0 ? (
                      <div className="text-stone-400 text-sm">No audit entries recorded.</div>
                    ) : (
                      <div className="space-y-2">
                        {auditLog.map((log, i) => (
                          <div key={i} className="border border-stone-200 rounded-lg p-3 text-sm bg-stone-50/50 flex items-center justify-between">
                            <div>
                              <div className="font-medium text-violet-950">{log.action} <span className="text-xs font-normal text-stone-500">by {log.actor_name}</span></div>
                              {log.details && <div className="text-xs text-stone-600 mt-0.5">{log.details}</div>}
                            </div>
                            <div className="text-xs text-stone-400">{fmt(log.created_at)}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* Tab Content: Version History */}
                {tab === "versions" && (
                  <div className="p-5 space-y-3">
                    <h3 className="font-serif text-lg mb-2">Version History</h3>
                    {versions.length === 0 ? (
                      <div className="text-stone-400 text-sm">No version history available.</div>
                    ) : (
                      <div className="space-y-2">
                        {versions.map((v, i) => (
                          <div key={i} className="border border-stone-200 rounded-lg p-3 text-sm bg-stone-50/50 flex items-center justify-between">
                            <div>
                              <div className="font-medium">Version {v.version_no}</div>
                              <div className="text-xs text-stone-500">Saved by {v.actor_name} · {fmt(v.created_at)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* Tab Content: Report Cards */}
                {tab === "report_cards" && exam.status === "published" && (
                  <div className="p-5 space-y-3">
                    <h3 className="font-serif text-lg mb-2">Student Report Cards</h3>
                    {reportCards.length === 0 ? (
                      <div className="text-stone-400 text-sm">Generating report cards…</div>
                    ) : (
                      <div className="space-y-2">
                        {reportCards.map((rc, i) => (
                          <div key={i} className="border border-stone-200 rounded-lg p-4 bg-stone-50/50 flex items-center justify-between">
                            <div>
                              <div className="font-medium">{rc.student_name} ({rc.admission_no})</div>
                              <div className="text-xs text-stone-500">Total Score: {rc.total_score} · Position: {getOrdinalSuffix(rc.position)} · Grade: {rc.grade}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      {/* REASON MODAL */}
      {modal && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
            <h3 className="font-serif text-xl font-bold">
              {modal === "admin_return" && "Return Exam to Teacher"}
              {modal === "hm_return" && "Return Exam to Administrator"}
              {modal === "reject_correction" && "Reject Correction Request"}
              {modal === "emergency_unlock" && "Emergency Unlock Exam"}
              {modal === "file_correction" && "Submit Correction Request"}
            </h3>
            <p className="text-xs text-stone-500">
              {modal === "file_correction" ? "Please provide a reason for this post-approval correction request:" : "Please provide a mandatory reason for this action:"}
            </p>
            <textarea rows="3" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Type your detailed reason here…" className="w-full border border-stone-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-gold" />
            <div className="flex justify-end gap-2 pt-2">
              <Btn onClick={() => { setModal(null); setReason(""); }}>Cancel</Btn>
              <Btn kind={["admin_return", "hm_return", "reject_correction", "emergency_unlock"].includes(modal) ? "danger" : "primary"} onClick={confirmModal}>Confirm</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
