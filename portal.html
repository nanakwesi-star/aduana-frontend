<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const API_BASE = "https://aduana-results-api.onrender.com";

const STATUS_META = {
  draft: { label: "Draft", color: "bg-stone-200 text-stone-700" },
  submitted: { label: "Awaiting Admin Review", color: "bg-amber-100 text-amber-800" },
  admin_returned: { label: "Returned to Teacher", color: "bg-rose-100 text-rose-800" },
  admin_approved: { label: "Awaiting Headmaster", color: "bg-violet-100 text-violet-800" },
  hm_returned: { label: "Returned to Administrator", color: "bg-rose-100 text-rose-800" },
  published: { label: "Published", color: "bg-emerald-100 text-emerald-800" },
  correction_pending_admin: { label: "Correction — Awaiting Admin", color: "bg-amber-100 text-amber-800" },
  correction_pending_hm: { label: "Correction — Awaiting Headmaster", color: "bg-violet-100 text-violet-800" },
  locked: { label: "Permanently Locked", color: "bg-stone-800 text-stone-100" },
};

function decodeToken(token) {
  try {
    const payload = token.split(".")[1];
    const norm = payload.replace(/-/g, "+").replace(/_/g, "/");
    const padded = norm + "===".slice((norm.length + 3) % 4);
    return JSON.parse(atob(padded));
  } catch { return null; }
}

function fmt(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleString(undefined, { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

async function api(path, token, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
  return data;
}

function Badge({ status }) {
  const meta = STATUS_META[status] || { label: status, color: "bg-stone-200 text-stone-700" };
  return <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${meta.color}`}>{meta.label}</span>;
}

function Btn({ children, onClick, kind = "secondary", disabled }) {
  const styles = {
    primary: "bg-gold text-violet-950 font-semibold hover:bg-gold-light",
    success: "bg-emerald-700 text-white hover:bg-emerald-800",
    danger: "bg-rose-700 text-white hover:bg-rose-800",
    secondary: "bg-stone-200 text-stone-800 hover:bg-stone-300",
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed ${styles[kind]}`}>
      {children}
    </button>
  );
}

function ChangePasswordModal({ token, onClose, showToastFn }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);

  async function submit() {
    if (newPassword.length < 8) return setError("New password must be at least 8 characters.");
    if (newPassword !== confirmPassword) return setError("New passwords do not match.");
    setSaving(true); setError(null);
    try {
      await api("/api/auth/change-password", token, { method: "POST", body: JSON.stringify({ currentPassword, newPassword }) });
      showToastFn("Password changed.", "success");
      onClose();
    } catch (e) { setError(e.message); }
    setSaving(false);
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
      <div className="bg-white rounded-lg shadow-xl w-full max-w-sm p-5">
        <div className="font-medium mb-3">Change Password</div>
        <input type="password" placeholder="Current password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        <input type="password" placeholder="New password (min 8 chars)" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        <input type="password" placeholder="Confirm new password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm mb-2" />
        {error && <div className="text-rose-700 text-xs mb-2">{error}</div>}
        <div className="flex justify-end gap-2 mt-2">
          <Btn onClick={onClose}>Cancel</Btn>
          <Btn kind="primary" onClick={submit} disabled={saving}>{saving ? "Saving…" : "Save"}</Btn>
        </div>
      </div>
    </div>
  );
}

function ParentDashboard({ user, token, onSignOut }) {
  const [children, setChildren] = useState([]);
  const [selectedChild, setSelectedChild] = useState(null);
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showChangePw, setShowChangePw] = useState(false);
  const [toast, setToast] = useState(null);
  function showToast(msg, kind = "info") { setToast({ msg, kind }); setTimeout(() => setToast(null), 3000); }

  useEffect(() => {
    api("/api/parent/children", token).then((rows) => {
      setChildren(rows);
      if (rows.length === 1) setSelectedChild(rows[0].id);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [token]);

  useEffect(() => {
    if (!selectedChild) { setResults(null); return; }
    api(`/api/parent/children/${selectedChild}/results`, token).then(setResults).catch(() => setResults([]));
  }, [selectedChild, token]);

  const child = children.find((c) => c.id === selectedChild);

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <div className="bg-violet-950 text-violet-50 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xl">🏅</span>
          <div><div className="font-serif text-lg leading-tight">Aduana Model JHS</div>
          <div className="text-[11px] text-violet-300 -mt-0.5">Parent Portal</div></div>
        </div>
        <div className="flex items-center gap-3 text-sm">
          <span className="text-violet-200">{user.name} · Parent</span>
          <button onClick={() => setShowChangePw(true)} className="text-violet-300 hover:text-white">Change password</button>
          <button onClick={onSignOut} className="text-violet-300 hover:text-white">Sign out</button>
        </div>
      </div>
      {showChangePw && <ChangePasswordModal token={token} onClose={() => setShowChangePw(false)} showToastFn={showToast} />}
      {toast && <div className={`fixed bottom-4 right-4 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white z-50 ${toast.kind === "error" ? "bg-rose-700" : toast.kind === "success" ? "bg-emerald-700" : "bg-stone-800"}`}>{toast.msg}</div>}

      <div className="max-w-3xl mx-auto p-4 md:p-6">
        {loading ? (
          <div className="text-stone-400 text-sm">Loading…</div>
        ) : children.length === 0 ? (
          <div className="bg-white border border-stone-200 rounded-xl p-6 text-sm text-stone-500">
            No children are linked to your account yet. Contact the school office to have them linked.
          </div>
        ) : (
          <>
            <h1 className="font-serif text-2xl mb-3">My Children</h1>
            <div className="flex flex-wrap gap-2 mb-5">
              {children.map((c) => (
                <button key={c.id} onClick={() => setSelectedChild(c.id)}
                  className={`px-3 py-2 rounded-lg border text-sm ${selectedChild === c.id ? "bg-violet-800 text-white border-violet-800" : "bg-white border-stone-200 hover:border-violet-300"}`}>
                  {c.full_name} <span className="opacity-70">· {c.class}</span>
                </button>
              ))}
            </div>

            {child && (
              <div>
                <div className="bg-white border border-stone-200 rounded-xl p-4 mb-3">
                  <div className="font-medium">{child.full_name}</div>
                  <div className="text-sm text-stone-500">{child.class} · Admission No. {child.admission_no}</div>
                </div>
                <h2 className="font-serif text-lg mb-2">Published Results</h2>
                {results === null ? (
                  <div className="text-sm text-stone-400">Loading…</div>
                ) : results.length === 0 ? (
                  <div className="bg-white border border-stone-200 rounded-xl p-4 text-sm text-stone-500">No published results yet.</div>
                ) : (
                  <div className="space-y-2">
                    {results.map((r, i) => (
                      <div key={i} className="bg-white border border-stone-200 rounded-xl p-4 flex items-center justify-between">
                        <div>
                          <div className="font-medium">{r.subject}</div>
                          <div className="text-xs text-stone-500">{r.term} {r.academic_year} · Published {fmt(r.published_at)}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-xl font-serif">{r.score}</div>
                          {r.grade && <div className="text-xs text-stone-500">Grade {r.grade}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function StudentDashboard({ user, token, onSignOut }) {
  const [me, setMe] = useState(null);
  const [results, setResults] = useState(null);
  const [showChangePw, setShowChangePw] = useState(false);
  const [toast, setToast] = useState(null);
  function showToast(msg, kind = "info") { setToast({ msg, kind }); setTimeout(() => setToast(null), 3000); }

  useEffect(() => {
    api("/api/student/me", token).then(setMe).catch(() => {});
    api("/api/student/results", token).then(setResults).catch(() => setResults([]));
  }, [token]);

  const average = results && results.length
    ? (results.reduce((sum, r) => sum + Number(r.score), 0) / results.length).toFixed(1)
    : null;

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <div className="bg-violet-950 text-violet-50 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xl">🏅</span>
          <div><div className="font-serif text-lg leading-tight">Aduana Model JHS</div>
          <div className="text-[11px] text-violet-300 -mt-0.5">Student Portal</div></div>
        </div>
        <div className="flex items-center gap-3 text-sm">
          <span className="text-violet-200">{user.name} · Student</span>
          <button onClick={() => setShowChangePw(true)} className="text-violet-300 hover:text-white">Change password</button>
          <button onClick={onSignOut} className="text-violet-300 hover:text-white">Sign out</button>
        </div>
      </div>
      {showChangePw && <ChangePasswordModal token={token} onClose={() => setShowChangePw(false)} showToastFn={showToast} />}
      {toast && <div className={`fixed bottom-4 right-4 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white z-50 ${toast.kind === "error" ? "bg-rose-700" : toast.kind === "success" ? "bg-emerald-700" : "bg-stone-800"}`}>{toast.msg}</div>}

      <div className="max-w-3xl mx-auto p-4 md:p-6">
        <h1 className="font-serif text-2xl mb-1">Welcome back, {user.name.split(" ")[0]}!</h1>
        {me && <div className="text-sm text-stone-500 mb-4">{me.class} · Admission No. {me.admission_no}</div>}

        <div className="grid grid-cols-2 gap-3 mb-6">
          <div className="bg-white border border-stone-200 rounded-xl p-4 text-center">
            <div className="text-2xl font-serif">{results ? results.length : "—"}</div>
            <div className="text-xs text-stone-500">Published Results</div>
          </div>
          <div className="bg-white border border-stone-200 rounded-xl p-4 text-center">
            <div className="text-2xl font-serif">{average ?? "—"}</div>
            <div className="text-xs text-stone-500">Average Score</div>
          </div>
        </div>

        <h2 className="font-serif text-lg mb-2">My Results</h2>
        {results === null ? (
          <div className="text-sm text-stone-400">Loading…</div>
        ) : results.length === 0 ? (
          <div className="bg-white border border-stone-200 rounded-xl p-4 text-sm text-stone-500">No published results yet.</div>
        ) : (
          <div className="space-y-2">
            {results.map((r, i) => (
              <div key={i} className="bg-white border border-stone-200 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="font-medium">{r.subject}</div>
                  <div className="text-xs text-stone-500">{r.term} {r.academic_year} · Published {fmt(r.published_at)}</div>
                </div>
                <div className="text-right">
                  <div className="text-xl font-serif">{r.score}</div>
                  {r.grade && <div className="text-xs text-stone-500">Grade {r.grade}</div>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState(null);
  const [loggingIn, setLoggingIn] = useState(false);
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [exams, setExams] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [exam, setExam] = useState(null);
  const [tab, setTab] = useState("marks");
  const [auditLog, setAuditLog] = useState([]);
  const [versions, setVersions] = useState([]);
  const [reportCards, setReportCards] = useState([]);
  const [pendingCorrection, setPendingCorrection] = useState(null);
  const [students, setStudents] = useState([]);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [myAssignments, setMyAssignments] = useState([]);
  const [currentTerm, setCurrentTerm] = useState(null);
  const [selectedAssignment, setSelectedAssignment] = useState("");
  const [newStudent, setNewStudent] = useState({ fullName: "", admissionNo: "" });
  const [marksEdit, setMarksEdit] = useState(null);
  const [correctionMode, setCorrectionMode] = useState(false);
  const [modal, setModal] = useState(null);
  const [reason, setReason] = useState("");
  const [view, setView] = useState("exams"); // "exams" | "admin"
  const [staffList, setStaffList] = useState([]);
  const [classList, setClassList] = useState([]);
  const [newStaff, setNewStaff] = useState({ name: "", email: "", password: "", role: "teacher" });
  const [newClass, setNewClass] = useState({ name: "", academicYear: "2026" });
  const [termForm, setTermForm] = useState({ term: "Term 2", academicYear: "2026" });
  const [showChangePw, setShowChangePw] = useState(false);

  async function updateTermSettings() {
    if (!termForm.term || !termForm.academicYear) return showToast("Enter both term and year.", "error");
    try {
      const updated = await api("/api/admin/settings/term", token, { method: "PUT", body: JSON.stringify({ term: termForm.term, academicYear: Number(termForm.academicYear) }) });
      setCurrentTerm(updated);
      showToast("Current term updated.", "success");
    } catch (e) { showToast(e.message, "error"); }
  }
  const [assignSubject, setAssignSubject] = useState({}); // { [classId]: { subject, teacherId } }

  async function loadAdminData() {
    try {
      const [staff, classes] = await Promise.all([
        api("/api/admin/users", token),
        api("/api/admin/classes", token),
      ]);
      setStaffList(staff);
      setClassList(classes);
    } catch (e) { showToast(e.message, "error"); }
  }

  useEffect(() => { if (token && view === "admin") loadAdminData(); }, [token, view]);

  async function createStaff() {
    if (!newStaff.name || !newStaff.email || !newStaff.password) return showToast("Fill in name, email, and password.", "error");
    try {
      await api("/api/admin/users", token, { method: "POST", body: JSON.stringify(newStaff) });
      showToast("Staff account created.", "success");
      setNewStaff({ name: "", email: "", password: "", role: "teacher" });
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  async function deactivateStaff(id) {
    try {
      await api(`/api/admin/users/${id}/deactivate`, token, { method: "PATCH" });
      showToast("Account deactivated.", "success");
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  const [resetPwFor, setResetPwFor] = useState(null); // user/parent id currently showing a reset field
  const [resetPwValue, setResetPwValue] = useState("");

  async function resetAccountPassword(id) {
    if (!resetPwValue || resetPwValue.length < 8) return showToast("New password must be at least 8 characters.", "error");
    try {
      await api(`/api/admin/users/${id}/reset-password`, token, { method: "PATCH", body: JSON.stringify({ newPassword: resetPwValue }) });
      showToast("Password reset.", "success");
      setResetPwFor(null); setResetPwValue("");
    } catch (e) { showToast(e.message, "error"); }
  }

  async function createClass() {
    if (!newClass.name) return showToast("Enter a class name.", "error");
    try {
      await api("/api/admin/classes", token, { method: "POST", body: JSON.stringify({ ...newClass, academicYear: Number(newClass.academicYear) }) });
      showToast("Class created.", "success");
      setNewClass({ name: "", academicYear: "2026" });
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  async function setFormMaster(classId, teacherId) {
    try {
      await api(`/api/admin/classes/${classId}/form-master`, token, { method: "PATCH", body: JSON.stringify({ teacherId }) });
      showToast("Form master set.", "success");
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  async function assignSubjectTeacher(classId) {
    const { subject, teacherId } = assignSubject[classId] || {};
    if (!subject || !teacherId) return showToast("Pick a subject and teacher.", "error");
    try {
      await api(`/api/admin/classes/${classId}/subjects`, token, { method: "POST", body: JSON.stringify({ subject, teacherId }) });
      showToast("Subject teacher assigned.", "success");
      setAssignSubject({ ...assignSubject, [classId]: {} });
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  async function removeSubjectAssignment(classId, subject) {
    try {
      await api(`/api/admin/classes/${classId}/subjects/${encodeURIComponent(subject)}`, token, { method: "DELETE" });
      loadAdminData();
    } catch (e) { showToast(e.message, "error"); }
  }

  // --- Parent accounts ---
  const [parentsList, setParentsList] = useState([]);
  const [newParent, setNewParent] = useState({ name: "", email: "", password: "", admissionNos: "" });

  async function loadParents() {
    try { setParentsList(await api("/api/admin/parents", token)); } catch (e) { showToast(e.message, "error"); }
  }

  async function createParent() {
    if (!newParent.name || !newParent.email || !newParent.password) return showToast("Fill in name, email, and password.", "error");
    const admissionNos = newParent.admissionNos.split(",").map((s) => s.trim()).filter(Boolean);
    try {
      const result = await api("/api/admin/parents", token, { method: "POST", body: JSON.stringify({ ...newParent, admissionNos }) });
      showToast(`Parent account created. Linked: ${result.linked.join(", ") || "none yet"}.${result.notFound.length ? " Not found: " + result.notFound.join(", ") : ""}`, result.notFound.length ? "error" : "success");
      setNewParent({ name: "", email: "", password: "", admissionNos: "" });
      loadParents();
    } catch (e) { showToast(e.message, "error"); }
  }

  // --- Student logins ---
  const [allStudents, setAllStudents] = useState([]);
  const [credentialForm, setCredentialForm] = useState({}); // { [studentId]: { email, password } }
  const [showCredentialFor, setShowCredentialFor] = useState(null);

  async function loadAllStudents() {
    try { setAllStudents(await api("/api/students", token)); } catch (e) { showToast(e.message, "error"); }
  }

  async function issueCredentials(studentId) {
    const form = credentialForm[studentId] || {};
    if (!form.email || !form.password) return showToast("Enter an email and password.", "error");
    try {
      await api(`/api/admin/students/${studentId}/set-credentials`, token, { method: "POST", body: JSON.stringify(form) });
      showToast("Login issued.", "success");
      setShowCredentialFor(null);
      setCredentialForm({ ...credentialForm, [studentId]: {} });
      loadAllStudents();
    } catch (e) { showToast(e.message, "error"); }
  }

  useEffect(() => { if (token && view === "admin") { loadParents(); loadAllStudents(); } }, [token, view]);

  function showToast(msg, kind = "info") { setToast({ msg, kind }); setTimeout(() => setToast(null), 3500); }

  async function signIn() {
    if (!email.trim() || !password) return setLoginError("Enter your email and password.");
    setLoggingIn(true); setLoginError(null);
    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Sign-in failed.");
      setUser(json.user); setToken(json.token);
    } catch (e) {
      setLoginError(e.message);
    }
    setLoggingIn(false);
  }
  function signOut() { setToken(null); setUser(null); setEmail(""); setPassword(""); setExams([]); setExam(null); setSelectedId(null); setView("exams"); }

  const loadExams = useCallback(async () => {
    if (!token) return;
    setLoading(true);
    try { setExams(await api("/api/exams", token)); } catch (e) { showToast(e.message, "error"); }
    setLoading(false);
  }, [token]);

  const loadExamDetail = useCallback(async (id) => {
    if (!token || !id) return;
    setLoading(true);
    try {
      const data = await api(`/api/exams/${id}`, token);
      setExam(data); setMarksEdit(null);
      const s = await api(`/api/students?class=${encodeURIComponent(data.class)}`, token);
      setStudents(s);
      if (["administrator", "headmaster", "super_administrator"].includes(user?.role)) {
        api(`/api/exams/${id}/audit-log`, token).then(setAuditLog).catch(() => {});
      }
      api(`/api/exams/${id}/versions`, token).then(setVersions).catch(() => {});
      api(`/api/exams/${id}/report-cards`, token).then(setReportCards).catch(() => setReportCards([]));
      api(`/api/exams/${id}/pending-correction`, token).then(setPendingCorrection).catch(() => setPendingCorrection(null));
    } catch (e) { showToast(e.message, "error"); }
    setLoading(false);
  }, [token, user]);

  useEffect(() => { if (token) loadExams(); }, [token, loadExams]);
  useEffect(() => { if (selectedId) loadExamDetail(selectedId); }, [selectedId, loadExamDetail]);

  async function createExam() {
    if (!selectedAssignment) return showToast("Pick a class and subject.", "error");
    const [classId, subject] = selectedAssignment.split("|||");
    try {
      const created = await api("/api/exams", token, { method: "POST", body: JSON.stringify({ classId, subject }) });
      showToast("Exam created.", "success");
      setSelectedAssignment("");
      await loadExams(); setSelectedId(created.id);
    } catch (e) { showToast(e.message, "error"); }
  }

  const loadTeacherSetupData = useCallback(async () => {
    if (!token) return;
    try {
      setCurrentTerm(await api("/api/exams/settings/term", token));
      if (user?.role === "teacher") setMyAssignments(await api("/api/exams/my-assignments", token));
    } catch (e) { /* non-fatal */ }
  }, [token, user]);

  useEffect(() => { loadTeacherSetupData(); }, [loadTeacherSetupData]);
  useEffect(() => { if (currentTerm) setTermForm({ term: currentTerm.term, academicYear: String(currentTerm.academic_year) }); }, [currentTerm]);

  async function addStudent() {
    if (!newStudent.fullName || !newStudent.admissionNo) return showToast("Enter name and admission number.", "error");
    try {
      await api("/api/students", token, { method: "POST", body: JSON.stringify({ ...newStudent, class: exam.class }) });
      setNewStudent({ fullName: "", admissionNo: "" });
      setStudents(await api(`/api/students?class=${encodeURIComponent(exam.class)}`, token));
      showToast("Student added.", "success");
    } catch (e) { showToast(e.message, "error"); }
  }

  function startMarksEdit() {
    const existing = new Map(exam.marks.map((m) => [m.student_id, m]));
    setMarksEdit(students.map((s) => ({ student_id: s.id, name: s.full_name, score: existing.get(s.id)?.score ?? "" })));
  }
  function startCorrection() { startMarksEdit(); setCorrectionMode(true); }

  async function decideCorrection(approve, reasonText) {
    const path = user.role === "administrator" ? "admin-decision" : "headmaster-decision";
    try {
      await api(`/api/exams/corrections/${pendingCorrection.id}/${path}`, token, {
        method: "POST", body: JSON.stringify({ approve, reason: reasonText || undefined }),
      });
      showToast(approve ? "Correction approved." : "Correction rejected.", "success");
      await loadExamDetail(exam.id);
    } catch (e) { showToast(e.message, "error"); }
  }

  async function saveMarks() {
    const marks = marksEdit.filter((m) => m.score !== "").map((m) => ({ student_id: m.student_id, score: Number(m.score) }));
    if (correctionMode) {
      setModal("file_correction");
      return;
    }
    try {
      await api(`/api/exams/${exam.id}/marks`, token, { method: "PUT", body: JSON.stringify({ marks }) });
      showToast("Marks saved.", "success"); await loadExamDetail(exam.id);
    } catch (e) { showToast(e.message, "error"); }
  }

  const [uploadResult, setUploadResult] = useState(null);
  const [uploading, setUploading] = useState(false);

  async function uploadStudentsFile(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;
    setUploading(true); setUploadResult(null);
    try {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("class", exam.class);
      const res = await fetch(`${API_BASE}/api/students/bulk-upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Upload failed.");
      setUploadResult(json);
      setStudents(await api(`/api/students?class=${encodeURIComponent(exam.class)}`, token));
      showToast(`${json.added.length} student(s) added.`, "success");
    } catch (e) { showToast(e.message, "error"); }
    setUploading(false);
    fileInput.value = "";
  }

  const [marksUploadResult, setMarksUploadResult] = useState(null);
  const [marksUploading, setMarksUploading] = useState(false);

  async function uploadMarksFile(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;
    setMarksUploading(true); setMarksUploadResult(null);
    try {
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch(`${API_BASE}/api/exams/${exam.id}/marks/bulk-upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Upload failed.");
      setMarksUploadResult(json);
      showToast(`${json.updated.length} mark(s) updated.`, "success");
      await loadExamDetail(exam.id);
    } catch (e) { showToast(e.message, "error"); }
    setMarksUploading(false);
    fileInput.value = "";
  }


  async function act(path, method = "POST", body) {
    try {
      await api(`/api/exams/${exam.id}${path}`, token, { method, body: body ? JSON.stringify(body) : undefined });
      showToast("Done.", "success");
      await Promise.all([loadExamDetail(exam.id), loadExams()]);
    } catch (e) { showToast(e.message, "error"); }
  }

  function openReasonModal(type) { setReason(""); setModal(type); }
  async function confirmModal() {
    if (!reason.trim()) return showToast("A reason is required.", "error");
    if (modal === "admin_return") await act("/admin-return", "POST", { reason });
    if (modal === "hm_return") await act("/hm-return", "POST", { reason });
    if (modal === "reject_correction") await decideCorrection(false, reason);
    if (modal === "emergency_unlock") {
      try {
        await api(`/api/super-admin/exams/${exam.id}/emergency-unlock`, token, { method: "POST", body: JSON.stringify({ reason }) });
        showToast("Exam unlocked.", "success");
        await Promise.all([loadExamDetail(exam.id), loadExams()]);
      } catch (e) { showToast(e.message, "error"); }
    }
    if (modal === "file_correction") {
      const marks = marksEdit.filter((m) => m.score !== "").map((m) => ({ student_id: m.student_id, score: Number(m.score) }));
      try {
        await api(`/api/exams/${exam.id}/corrections`, token, { method: "POST", body: JSON.stringify({ reason, proposedMarks: marks }) });
        showToast("Correction request filed.", "success");
        setMarksEdit(null); setCorrectionMode(false);
        await loadExamDetail(exam.id);
      } catch (e) { showToast(e.message, "error"); }
    }
    setModal(null);
  }

  if (!token) {
    return (
      <div className="min-h-screen bg-stone-50 flex items-center justify-center p-6">
        <div className="max-w-sm w-full">
          <div className="flex items-center gap-2 mb-6 justify-center">
            <span className="text-2xl">🏅</span>
            <span className="font-serif text-xl text-violet-950">Aduana Model JHS</span>
          </div>
          <div className="bg-white border border-stone-200 rounded-xl p-6 shadow-sm">
            <h1 className="font-serif text-lg text-stone-900 mb-1">Sign in</h1>
            <p className="text-sm text-stone-500 mb-4">Staff, parents, and students all sign in here — you'll land on the right dashboard automatically.</p>
            <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && signIn()}
              type="email" placeholder="you@aduanamodel.edu.gh"
              className="w-full border border-stone-300 rounded-md px-3 py-2 text-sm mb-2" />
            <input value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && signIn()}
              type="password" placeholder="Password"
              className="w-full border border-stone-300 rounded-md px-3 py-2 text-sm mb-3" />
            {loginError && <div className="text-rose-700 text-xs mb-3">{loginError}</div>}
            <Btn kind="primary" onClick={signIn} disabled={loggingIn}>{loggingIn ? "Signing in…" : "Sign in"}</Btn>
          </div>
        </div>
      </div>
    );
  }

  if (user.role === "parent") return <ParentDashboard user={user} token={token} onSignOut={signOut} />;
  if (user.role === "student") return <StudentDashboard user={user} token={token} onSignOut={signOut} />;

  const canAct = {
    createExam: user.role === "teacher",
    editMarks: exam && user.role === "teacher" && exam.teacher_id === user.id && ["draft", "admin_returned"].includes(exam.status),
    submit: exam && user.role === "teacher" && exam.teacher_id === user.id && ["draft", "admin_returned"].includes(exam.status),
    adminAct: exam && user.role === "administrator" && ["submitted", "hm_returned"].includes(exam.status),
    hmAct: exam && user.role === "headmaster" && exam.status === "admin_approved",
    fileCorrection: exam && ["teacher", "administrator", "headmaster"].includes(user.role) && exam.status === "published",
    adminCorrectionAct: exam && user.role === "administrator" && exam.status === "correction_pending_admin" && pendingCorrection,
    hmCorrectionAct: exam && user.role === "headmaster" && exam.status === "correction_pending_hm" && pendingCorrection,
    emergencyUnlock: exam && user.role === "super_administrator" && exam.status === "locked",
  };

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <div className="bg-violet-950 text-violet-50 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xl">🏅</span>
          <div><div className="font-serif text-lg leading-tight">Aduana Model JHS</div>
          <div className="text-[11px] text-violet-300 -mt-0.5">Results Workflow</div></div>
        </div>
        <div className="flex items-center gap-3 text-sm">
          {user.role === "administrator" && (
            <button onClick={() => setView(view === "admin" ? "exams" : "admin")} className={`px-2.5 py-1 rounded text-xs font-medium ${view === "admin" ? "bg-amber-500 text-violet-950" : "text-violet-200 hover:text-white border border-violet-700"}`}>
              {view === "admin" ? "Back to Exams" : "Admin Panel"}
            </button>
          )}
          <span className="text-violet-200">{user.name} · <span className="capitalize">{user.role.replace("_", " ")}</span></span>
          <button onClick={() => setShowChangePw(true)} className="text-violet-300 hover:text-white">Change password</button>
          <button onClick={signOut} className="text-violet-300 hover:text-white">Sign out</button>
        </div>
      </div>
      {showChangePw && <ChangePasswordModal token={token} onClose={() => setShowChangePw(false)} showToastFn={showToast} />}

      {view === "admin" && user.role === "administrator" ? (
        <div className="p-4 md:p-6 max-w-4xl">
          <h1 className="font-serif text-2xl mb-4">Admin Panel</h1>

          {/* Term Settings */}
          <div className="mb-8">
            <h2 className="font-serif text-lg mb-2">Current Term</h2>
            <div className="border border-stone-200 rounded-lg bg-white p-4">
              <p className="text-xs text-stone-500 mb-2">
                This is locked school-wide — every new exam any teacher creates automatically takes this term and year. Teachers cannot override it.
              </p>
              <div className="flex gap-2 items-end">
                <div>
                  <label className="text-xs text-stone-500 block mb-1">Term</label>
                  <select value={termForm.term} onChange={(e) => setTermForm({ ...termForm, term: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm">
                    <option>Term 1</option><option>Term 2</option><option>Term 3</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-stone-500 block mb-1">Year</label>
                  <input value={termForm.academicYear} onChange={(e) => setTermForm({ ...termForm, academicYear: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm w-24" />
                </div>
                <Btn kind="primary" onClick={updateTermSettings}>Update current term</Btn>
              </div>
              {currentTerm && <div className="text-xs text-emerald-700 mt-2">Currently active: {currentTerm.term} {currentTerm.academic_year}</div>}
            </div>
          </div>

          {/* Staff Accounts */}
          <div className="mb-8">
            <h2 className="font-serif text-lg mb-2">Staff Accounts</h2>
            <div className="border border-stone-200 rounded-lg bg-white p-4 mb-3">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input placeholder="Full name" value={newStaff.name} onChange={(e) => setNewStaff({ ...newStaff, name: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <input placeholder="Email" type="email" value={newStaff.email} onChange={(e) => setNewStaff({ ...newStaff, email: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <input placeholder="Password (min 8 chars)" type="text" value={newStaff.password} onChange={(e) => setNewStaff({ ...newStaff, password: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <select value={newStaff.role} onChange={(e) => setNewStaff({ ...newStaff, role: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm">
                  <option value="teacher">Teacher</option>
                  <option value="administrator">Administrator</option>
                  <option value="headmaster">Headmaster</option>
                </select>
              </div>
              <Btn kind="primary" onClick={createStaff}>+ Create staff account</Btn>
            </div>
            <div className="border border-stone-200 rounded-lg bg-white overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-stone-100 text-stone-600 text-xs uppercase"><tr><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Email</th><th className="text-left px-3 py-2">Role</th><th className="text-left px-3 py-2">Status</th><th></th></tr></thead>
                <tbody>
                  {staffList.map((s) => (
                    <React.Fragment key={s.id}>
                      <tr className="border-t border-stone-100">
                        <td className="px-3 py-2">{s.name}</td>
                        <td className="px-3 py-2">{s.email}</td>
                        <td className="px-3 py-2 capitalize">{s.role}</td>
                        <td className="px-3 py-2">{s.active ? <span className="text-emerald-700">Active</span> : <span className="text-stone-400">Inactive</span>}</td>
                        <td className="px-3 py-2 flex gap-2">
                          <button onClick={() => { setResetPwFor(resetPwFor === s.id ? null : s.id); setResetPwValue(""); }} className="text-violet-700 text-xs hover:underline">Reset password</button>
                          {s.active && <button onClick={() => deactivateStaff(s.id)} className="text-rose-600 text-xs hover:underline">Deactivate</button>}
                        </td>
                      </tr>
                      {resetPwFor === s.id && (
                        <tr className="bg-stone-50">
                          <td colSpan="5" className="px-3 py-2">
                            <div className="flex gap-1.5 items-center">
                              <input placeholder="New password (min 8 chars)" value={resetPwValue} onChange={(e) => setResetPwValue(e.target.value)} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                              <Btn onClick={() => resetAccountPassword(s.id)}>Save</Btn>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                  {staffList.length === 0 && <tr><td colSpan="5" className="px-3 py-4 text-center text-stone-400">No staff accounts yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {/* Classes */}
          <div>
            <h2 className="font-serif text-lg mb-2">Classes</h2>
            <div className="border border-stone-200 rounded-lg bg-white p-4 mb-3 flex gap-2">
              <input placeholder="Class name e.g. JHS 2B" value={newClass.name} onChange={(e) => setNewClass({ ...newClass, name: e.target.value })} className="flex-1 border border-stone-300 rounded px-2 py-1.5 text-sm" />
              <input placeholder="Year" value={newClass.academicYear} onChange={(e) => setNewClass({ ...newClass, academicYear: e.target.value })} className="w-24 border border-stone-300 rounded px-2 py-1.5 text-sm" />
              <Btn kind="primary" onClick={createClass}>+ Add class</Btn>
            </div>

            {classList.map((c) => (
              <div key={c.id} className="border border-stone-200 rounded-lg bg-white p-4 mb-3">
                <div className="flex items-center justify-between">
                  <div className="font-medium">{c.name} <span className="text-stone-400 font-normal text-sm">· {c.academic_year}</span></div>
                </div>

                <div className="mt-2 text-sm">
                  <label className="text-xs text-stone-500">Form Master</label>
                  <div className="flex items-center gap-2 mt-1">
                    <select value={c.form_master_id || ""} onChange={(e) => setFormMaster(c.id, e.target.value)} className="border border-stone-300 rounded px-2 py-1 text-sm">
                      <option value="">— None assigned —</option>
                      {staffList.filter((s) => s.role === "teacher").map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    {c.form_master_name && <span className="text-emerald-700 text-xs">Currently: {c.form_master_name}</span>}
                  </div>
                </div>

                <div className="mt-3 text-sm">
                  <label className="text-xs text-stone-500">Subject Teachers</label>
                  <div className="space-y-1 mt-1">
                    {c.subjectAssignments.map((a) => (
                      <div key={a.subject} className="flex items-center justify-between bg-stone-50 px-2 py-1 rounded text-xs">
                        <span>{a.subject} — {a.teacherName}</span>
                        <button onClick={() => removeSubjectAssignment(c.id, a.subject)} className="text-rose-600 hover:underline">Remove</button>
                      </div>
                    ))}
                    {c.subjectAssignments.length === 0 && <div className="text-xs text-stone-400">No subject teachers assigned yet.</div>}
                  </div>
                  <div className="flex gap-1.5 mt-2">
                    <input placeholder="Subject" value={assignSubject[c.id]?.subject || ""} onChange={(e) => setAssignSubject({ ...assignSubject, [c.id]: { ...assignSubject[c.id], subject: e.target.value } })} className="border border-stone-300 rounded px-2 py-1 text-xs flex-1" />
                    <select value={assignSubject[c.id]?.teacherId || ""} onChange={(e) => setAssignSubject({ ...assignSubject, [c.id]: { ...assignSubject[c.id], teacherId: e.target.value } })} className="border border-stone-300 rounded px-2 py-1 text-xs">
                      <option value="">Teacher…</option>
                      {staffList.filter((s) => s.role === "teacher").map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <Btn onClick={() => assignSubjectTeacher(c.id)}>Assign</Btn>
                  </div>
                </div>
              </div>
            ))}
            {classList.length === 0 && <div className="text-sm text-stone-400">No classes created yet.</div>}
          </div>

          {/* Parent Accounts */}
          <div className="mt-8">
            <h2 className="font-serif text-lg mb-2">Parent Accounts</h2>
            <div className="border border-stone-200 rounded-lg bg-white p-4 mb-3">
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input placeholder="Parent's full name" value={newParent.name} onChange={(e) => setNewParent({ ...newParent, name: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <input placeholder="Email" type="email" value={newParent.email} onChange={(e) => setNewParent({ ...newParent, email: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <input placeholder="Password (min 8 chars)" value={newParent.password} onChange={(e) => setNewParent({ ...newParent, password: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
                <input placeholder="Children's admission numbers, comma-separated" value={newParent.admissionNos} onChange={(e) => setNewParent({ ...newParent, admissionNos: e.target.value })} className="border border-stone-300 rounded px-2 py-1.5 text-sm" />
              </div>
              <Btn kind="primary" onClick={createParent}>+ Create parent account</Btn>
            </div>
            <div className="border border-stone-200 rounded-lg bg-white overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-stone-100 text-stone-600 text-xs uppercase"><tr><th className="text-left px-3 py-2">Name</th><th className="text-left px-3 py-2">Email</th><th className="text-left px-3 py-2">Children</th><th></th></tr></thead>
                <tbody>
                  {parentsList.map((p) => (
                    <React.Fragment key={p.id}>
                      <tr className="border-t border-stone-100">
                        <td className="px-3 py-2">{p.name}</td>
                        <td className="px-3 py-2">{p.email}</td>
                        <td className="px-3 py-2">{p.children.map((c) => c.fullName).join(", ") || <span className="text-stone-400">No children linked</span>}</td>
                        <td className="px-3 py-2"><button onClick={() => { setResetPwFor(resetPwFor === p.id ? null : p.id); setResetPwValue(""); }} className="text-violet-700 text-xs hover:underline">Reset password</button></td>
                      </tr>
                      {resetPwFor === p.id && (
                        <tr className="bg-stone-50">
                          <td colSpan="4" className="px-3 py-2">
                            <div className="flex gap-1.5 items-center">
                              <input placeholder="New password (min 8 chars)" value={resetPwValue} onChange={(e) => setResetPwValue(e.target.value)} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                              <Btn onClick={() => resetAccountPassword(p.id)}>Save</Btn>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                  {parentsList.length === 0 && <tr><td colSpan="4" className="px-3 py-4 text-center text-stone-400">No parent accounts yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          {/* Student Logins */}
          <div className="mt-8">
            <h2 className="font-serif text-lg mb-2">Student Logins</h2>
            <p className="text-xs text-stone-500 mb-2">Issue a student their own login so they can sign in and see their results directly.</p>
            <div className="border border-stone-200 rounded-lg bg-white overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-stone-100 text-stone-600 text-xs uppercase"><tr><th className="text-left px-3 py-2">Student</th><th className="text-left px-3 py-2">Class</th><th className="text-left px-3 py-2">Login Status</th><th></th></tr></thead>
                <tbody>
                  {allStudents.map((s) => (
                    <React.Fragment key={s.id}>
                      <tr className="border-t border-stone-100">
                        <td className="px-3 py-2">{s.full_name}</td>
                        <td className="px-3 py-2">{s.class}</td>
                        <td className="px-3 py-2">{s.email ? <span className="text-emerald-700">{s.email}</span> : <span className="text-stone-400">No login yet</span>}</td>
                        <td className="px-3 py-2">
                          <button onClick={() => setShowCredentialFor(showCredentialFor === s.id ? null : s.id)} className="text-violet-700 text-xs hover:underline">
                            {s.email ? "Reset login" : "Issue login"}
                          </button>
                        </td>
                      </tr>
                      {showCredentialFor === s.id && (
                        <tr className="bg-stone-50">
                          <td colSpan="4" className="px-3 py-2">
                            <div className="flex gap-1.5 items-center">
                              <input placeholder="Email" type="email" value={credentialForm[s.id]?.email || ""} onChange={(e) => setCredentialForm({ ...credentialForm, [s.id]: { ...credentialForm[s.id], email: e.target.value } })} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                              <input placeholder="Password (min 8 chars)" value={credentialForm[s.id]?.password || ""} onChange={(e) => setCredentialForm({ ...credentialForm, [s.id]: { ...credentialForm[s.id], password: e.target.value } })} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                              <Btn onClick={() => issueCredentials(s.id)}>Save</Btn>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                  {allStudents.length === 0 && <tr><td colSpan="4" className="px-3 py-4 text-center text-stone-400">No students yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      ) : (
      <div className="flex flex-col md:flex-row">
        <div className="md:w-72 border-r border-stone-200 bg-white min-h-[calc(100vh-56px)]">
          <div className="px-4 py-3 border-b border-stone-200 flex items-center justify-between">
            <span className="text-xs font-semibold uppercase tracking-wide text-stone-500">Examinations</span>
            <button onClick={loadExams} className="text-stone-400 hover:text-stone-600">⟳</button>
          </div>
          {canAct.createExam && (
            <div className="p-3 border-b border-stone-200 space-y-1.5 bg-stone-50">
              <div className="text-xs text-stone-500">
                Current term (locked by admin): <span className="font-medium text-stone-700">{currentTerm ? `${currentTerm.term} ${currentTerm.academic_year}` : "—"}</span>
              </div>
              <select value={selectedAssignment} onChange={(e) => setSelectedAssignment(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-xs">
                <option value="">— Select class &amp; subject —</option>
                {myAssignments.map((a) => (
                  <option key={`${a.class_id}|||${a.subject}`} value={`${a.class_id}|||${a.subject}`}>{a.class_name} — {a.subject}</option>
                ))}
              </select>
              {myAssignments.length === 0 && <div className="text-xs text-amber-700">You have no subject assignments yet — ask an Administrator to assign you a class and subject in the Admin Panel.</div>}
              <Btn kind="primary" onClick={createExam} disabled={!selectedAssignment}>+ New exam</Btn>
            </div>
          )}
          <div className="max-h-[70vh] overflow-y-auto">
            {loading && exams.length === 0 && <div className="p-4 text-sm text-stone-400">Loading…</div>}
            {!loading && exams.length === 0 && <div className="p-4 text-sm text-stone-400">No exams yet.</div>}
            {exams.map((e) => (
              <button key={e.id} onClick={() => setSelectedId(e.id)} className={`w-full text-left px-4 py-3 border-b border-stone-100 hover:bg-stone-50 ${selectedId === e.id ? "bg-violet-50" : ""}`}>
                <div className="flex justify-between"><span className="font-medium text-sm">{e.class}</span>{e.status === "locked" && <span>🔒</span>}</div>
                <div className="text-xs text-stone-500">{e.subject} · {e.term} {e.academic_year} · {e.teacher_name}</div>
                <div className="mt-1"><Badge status={e.status} /></div>
              </button>
            ))}
          </div>
        </div>

        <div className="flex-1 p-4 md:p-6">
          {!exam ? (
            <div className="text-stone-400 text-sm">Select an examination from the list.</div>
          ) : (
            <div className="max-w-3xl">
              <div className="flex items-start justify-between flex-wrap gap-2">
                <div>
                  <h1 className="font-serif text-2xl">{exam.class} — {exam.subject}</h1>
                  <div className="text-sm text-stone-500">{exam.term} {exam.academic_year} · Teacher: {exam.teacher_name} · <span className="font-mono text-xs bg-stone-100 px-1 rounded">{exam.id}</span></div>
                </div>
                <Badge status={exam.status} />
              </div>

              {exam.status === "locked" && (
                <div className="mt-4 bg-stone-800 text-stone-100 rounded-lg p-4 text-sm">
                  🔒 "This examination has been permanently locked after the 21-day validation period. No further modifications are permitted."
                </div>
              )}
              {exam.status === "published" && (
                <div className="mt-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg p-3 text-sm">
                  Published {fmt(exam.published_at)}. Locks permanently {fmt(exam.lock_at)}.
                </div>
              )}

              <div className="mt-5 flex gap-1 border-b border-stone-200 text-sm">
                {[["marks", "Marks"], ["actions", "Actions"], ["reports", "Reports"], ["audit", "Audit Log"], ["versions", "Versions"]].map(([key, label]) => (
                  <button key={key} onClick={() => setTab(key)} className={`px-3 py-2 border-b-2 -mb-px ${tab === key ? "border-violet-700 text-violet-800 font-medium" : "border-transparent text-stone-500"}`}>{label}</button>
                ))}
              </div>

              {tab === "marks" && (
                <div className="mt-4 space-y-3">
                  {canAct.editMarks && (
                    <div className="border border-violet-200 bg-violet-50 rounded-lg p-3 text-sm">
                      <div className="font-medium text-violet-900">Bulk-add students from a spreadsheet</div>
                      <div className="text-violet-700 text-xs mt-0.5 mb-2">Upload an Excel or CSV file with columns: Full Name, Admission No, Class (optional — defaults to {exam.class}), Parent Phone, Parent WhatsApp.</div>
                      <input type="file" accept=".xlsx,.xls,.csv" disabled={uploading} onChange={(e) => uploadStudentsFile(e.target)} className="text-xs" />
                      {uploading && <span className="text-xs text-violet-600 ml-2">Uploading…</span>}
                      {uploadResult && (
                        <div className="mt-2 text-xs space-y-0.5">
                          <div className="text-emerald-700">✓ {uploadResult.added.length} added</div>
                          {uploadResult.skipped.length > 0 && <div className="text-amber-700">⚠ {uploadResult.skipped.length} skipped (duplicate admission number)</div>}
                          {uploadResult.errors.length > 0 && <div className="text-rose-700">✗ {uploadResult.errors.length} row(s) had errors — check names/admission numbers are filled in</div>}
                        </div>
                      )}
                    </div>
                  )}
                  {canAct.editMarks && students.length > 0 && (
                    <div className="border border-violet-200 bg-violet-50 rounded-lg p-3 text-sm">
                      <div className="font-medium text-violet-900">Bulk-upload scores from a spreadsheet</div>
                      <div className="text-violet-700 text-xs mt-0.5 mb-2">Upload a file with columns: Admission No, Score, Grade (optional), Remarks (optional). Students must already be added below.</div>
                      <input type="file" accept=".xlsx,.xls,.csv" disabled={marksUploading} onChange={(e) => uploadMarksFile(e.target)} className="text-xs" />
                      {marksUploading && <span className="text-xs text-violet-600 ml-2">Uploading…</span>}
                      {marksUploadResult && (
                        <div className="mt-2 text-xs space-y-0.5">
                          <div className="text-emerald-700">✓ {marksUploadResult.updated.length} score(s) updated</div>
                          {marksUploadResult.skipped.length > 0 && <div className="text-amber-700">⚠ {marksUploadResult.skipped.length} skipped (admission number not found)</div>}
                          {marksUploadResult.errors.length > 0 && <div className="text-rose-700">✗ {marksUploadResult.errors.length} row(s) had errors — check admission number/score are filled in</div>}
                        </div>
                      )}
                    </div>
                  )}
                  {canAct.editMarks && students.length === 0 && (
                    <div className="border border-amber-200 bg-amber-50 rounded-lg p-3 text-sm">
                      No students in {exam.class} yet. Add one below.
                      <div className="flex gap-1.5 mt-2">
                        <input placeholder="Full name" value={newStudent.fullName} onChange={(e) => setNewStudent({ ...newStudent, fullName: e.target.value })} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                        <input placeholder="Admission no." value={newStudent.admissionNo} onChange={(e) => setNewStudent({ ...newStudent, admissionNo: e.target.value })} className="border border-stone-300 rounded px-2 py-1 text-xs" />
                        <Btn onClick={addStudent}>Add</Btn>
                      </div>
                    </div>
                  )}
                  <div className="border border-stone-200 rounded-lg bg-white overflow-hidden">
                    <table className="w-full text-sm">
                      <thead className="bg-stone-100 text-stone-600 text-xs uppercase"><tr><th className="text-left px-3 py-2">Student</th><th className="text-left px-3 py-2">Score</th></tr></thead>
                      <tbody>
                        {(marksEdit || exam.marks.map((m) => ({ student_id: m.student_id, name: m.full_name, score: m.score }))).map((row, i) => (
                          <tr key={row.student_id} className="border-t border-stone-100">
                            <td className="px-3 py-2">{row.name}</td>
                            <td className="px-3 py-2">
                              {marksEdit ? <input type="number" value={row.score} onChange={(e) => { const v = [...marksEdit]; v[i] = { ...v[i], score: e.target.value }; setMarksEdit(v); }} className="w-20 border border-stone-300 rounded px-2 py-1" /> : row.score}
                            </td>
                          </tr>
                        ))}
                        {!marksEdit && exam.marks.length === 0 && <tr><td colSpan="2" className="px-3 py-4 text-stone-400 text-center">No marks recorded yet.</td></tr>}
                      </tbody>
                    </table>
                    {canAct.editMarks && (
                      <div className="p-3 border-t border-stone-100 flex gap-2">
                        {!marksEdit ? <Btn onClick={startMarksEdit}>Edit marks</Btn> : <><Btn kind="success" onClick={saveMarks}>Save</Btn><Btn onClick={() => setMarksEdit(null)}>Cancel</Btn></>}
                      </div>
                    )}
                    {canAct.fileCorrection && (
                      <div className="p-3 border-t border-stone-100 flex gap-2">
                        {!marksEdit ? <Btn kind="secondary" onClick={startCorrection}>Request correction</Btn> : correctionMode && <><Btn kind="danger" onClick={saveMarks}>Submit correction request</Btn><Btn onClick={() => { setMarksEdit(null); setCorrectionMode(false); }}>Cancel</Btn></>}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {tab === "actions" && (
                <div className="mt-4 border border-stone-200 rounded-lg bg-white p-4">
                  {pendingCorrection && (canAct.adminCorrectionAct || canAct.hmCorrectionAct) && (
                    <div className="mb-3 bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm">
                      <div className="font-medium text-amber-900">Pending correction request</div>
                      <div className="text-amber-800 text-xs mt-1">Requested by {pendingCorrection.requested_by_name}: "{pendingCorrection.reason}"</div>
                      <div className="text-amber-700 text-xs mt-1">{pendingCorrection.proposed_marks?.length || 0} student score(s) proposed to change.</div>
                    </div>
                  )}
                  <div className="text-xs uppercase tracking-wide text-stone-400 mb-2">Available to you — {user.role.replace("_", " ")}</div>
                  <div className="flex flex-wrap gap-2">
                    {canAct.submit && <Btn kind="primary" onClick={() => act("/submit")}>Submit for review</Btn>}
                    {canAct.adminAct && <><Btn kind="success" onClick={() => act("/admin-approve")}>Approve &amp; forward</Btn><Btn kind="danger" onClick={() => openReasonModal("admin_return")}>Return to teacher</Btn></>}
                    {canAct.hmAct && <><Btn kind="success" onClick={() => act("/publish")}>Approve &amp; publish</Btn><Btn kind="danger" onClick={() => openReasonModal("hm_return")}>Return to administrator</Btn></>}
                    {canAct.adminCorrectionAct && <><Btn kind="success" onClick={() => decideCorrection(true)}>Approve correction &amp; forward</Btn><Btn kind="danger" onClick={() => openReasonModal("reject_correction")}>Reject correction</Btn></>}
                    {canAct.hmCorrectionAct && <><Btn kind="success" onClick={() => decideCorrection(true)}>Approve correction &amp; publish new version</Btn><Btn kind="danger" onClick={() => openReasonModal("reject_correction")}>Reject correction</Btn></>}
                    {canAct.emergencyUnlock && <Btn kind="danger" onClick={() => openReasonModal("emergency_unlock")}>Emergency unlock (Super Administrator)</Btn>}
                    {!canAct.submit && !canAct.adminAct && !canAct.hmAct && !canAct.adminCorrectionAct && !canAct.hmCorrectionAct && !canAct.emergencyUnlock && <div className="text-sm text-stone-400">No actions available at this stage for your role.</div>}
                  </div>
                </div>
              )}

              {tab === "reports" && (
                <div className="mt-4 space-y-2">
                  {!["published", "locked"].includes(exam.status) && (
                    <div className="text-sm text-stone-400">Report cards are generated once results are published.</div>
                  )}
                  {["published", "locked"].includes(exam.status) && reportCards.length === 0 && (
                    <div className="text-sm text-stone-400">No report cards found for this version yet.</div>
                  )}
                  {reportCards.map((rc, i) => (
                    <div key={i} className="border border-stone-200 rounded-lg bg-white p-3 flex items-center justify-between text-sm">
                      <div>
                        <div className="font-medium">{rc.studentName}</div>
                        <div className="text-xs text-stone-500">Generated {fmt(rc.generatedAt)}</div>
                      </div>
                      <div className="flex gap-2">
                        <a href={rc.pdfUrl} target="_blank" rel="noreferrer" className="text-violet-700 hover:underline text-xs">View PDF</a>
                        <a href={rc.verifyUrl} target="_blank" rel="noreferrer" className="text-stone-500 hover:underline text-xs">Verify link</a>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {tab === "audit" && (
                <div className="mt-4 border border-stone-200 rounded-lg bg-white p-4 space-y-1">
                  {!["administrator", "headmaster", "super_administrator"].includes(user.role) ? (
                    <div className="text-sm text-stone-400">The audit log is restricted to Administrators and the Headmaster.</div>
                  ) : auditLog.length === 0 ? <div className="text-sm text-stone-400">No entries yet.</div> : (
                    [...auditLog].reverse().map((e) => (
                      <div key={e.id} className="border-l-2 border-stone-300 pl-3 py-1.5">
                        <div className="text-xs text-stone-500">{fmt(e.created_at)} · {e.user_name} ({e.user_role})</div>
                        <div className="text-sm">{e.action}</div>
                        {e.reason && <div className="text-xs italic text-stone-500">Reason: {e.reason}</div>}
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === "versions" && (
                <div className="mt-4 space-y-2">
                  {versions.length === 0 && <div className="text-sm text-stone-400">Not published yet.</div>}
                  {[...versions].reverse().map((v) => (
                    <div key={v.version} className="border border-stone-200 rounded-lg bg-white p-3 text-sm">
                      <div className="flex justify-between"><span className="font-medium">Version {v.version}</span><span className="text-xs text-stone-400">{fmt(v.created_at)}</span></div>
                      {v.note && <div className="text-xs text-stone-500 mt-1">{v.note}</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
      )}

      {modal && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-5">
            <div className="font-medium mb-2">
              {modal === "admin_return" && "Return to teacher"}
              {modal === "hm_return" && "Return to administrator"}
              {modal === "file_correction" && "Request Correction — reason"}
              {modal === "reject_correction" && "Reject Correction Request"}
              {modal === "emergency_unlock" && "Emergency Unlock — mandatory reason"}
            </div>
            <textarea value={reason} onChange={(e) => setReason(e.target.value)} className="w-full border border-stone-300 rounded px-2 py-1.5 text-sm h-24" placeholder="Explain what needs correcting..." />
            <div className="flex justify-end gap-2 mt-4">
              <Btn onClick={() => setModal(null)}>Cancel</Btn>
              <Btn kind="danger" onClick={confirmModal}>Confirm</Btn>
            </div>
          </div>
        </div>
      )}

      {toast && <div className={`fixed bottom-4 right-4 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white z-50 ${toast.kind === "error" ? "bg-rose-700" : toast.kind === "success" ? "bg-emerald-700" : "bg-stone-800"}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
